name: QuestBridge XR Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  bed-asset:
    name: Generate upholstered bed meshes and fabric maps
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bed asset generator dependencies
        run: python -m pip install --upgrade pip numpy Pillow trimesh

      - name: Generate optimized and editable bed GLBs
        run: python art/bed/generate_bed_asset.py

      - name: Validate generated bed models
        run: |
          python - <<'PY'
          import json
          import trimesh
          from pathlib import Path
          out = Path('art/bed/generated')
          manifest = json.loads((out / 'bed_manifest.json').read_text())
          runtime = trimesh.load(out / 'arc_upholstered_bed.glb', force='scene')
          editable = trimesh.load(out / 'arc_upholstered_bed_editable.glb', force='scene')
          assert len(runtime.geometry) == 8, len(runtime.geometry)
          assert len(editable.geometry) >= 55, len(editable.geometry)
          dims = manifest['dimensions']
          assert 2.5 < dims[0] < 2.8 and 2.0 < dims[1] < 2.3 and 3.3 < dims[2] < 3.7, dims
          assert manifest['triangles'] < 300000, manifest['triangles']
          print(f"runtime meshes={len(runtime.geometry)} editable parts={len(editable.geometry)} dimensions={dims}")
          PY

      - name: Upload generated bed source models
        uses: actions/upload-artifact@v4
        with:
          name: bed-model-source
          path: art/bed/generated/
          if-no-files-found: error
          retention-days: 30

  windows-portable:
    name: Windows portable Studio + experimental OpenXR runtime
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packager
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run Python tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Build portable Windows package
        shell: pwsh
        run: .\scripts\build-portable.ps1 -SkipArchive

      - name: Verify portable deliverables
        shell: pwsh
        run: |
          $required = @(
            'dist/QuestBridgeXR-Portable/QuestBridgeStudio.exe',
            'dist/QuestBridgeXR-Portable/host/QuestBridgeHost.exe',
            'dist/QuestBridgeXR-Portable/tools/doctor.exe',
            'dist/QuestBridgeXR-Portable/tools/stream_test_video.exe',
            'dist/QuestBridgeXR-Portable/tools/monitor_telemetry.exe',
            'dist/QuestBridgeXR-Portable/tools/openxr_runtime.exe',
            'dist/QuestBridgeXR-Portable/runtime/qbx_openxr_runtime.dll',
            'dist/QuestBridgeXR-Portable/runtime/questbridge_openxr_runtime.json',
            'dist/QuestBridgeXR-Portable/config/default.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Build output missing: $path" }
          }
          Get-ChildItem 'dist/QuestBridgeXR-Portable' -Recurse -File | Measure-Object -Property Length -Sum | Format-List

      - name: Upload Windows portable files
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/QuestBridgeXR-Portable/
          if-no-files-found: error
          retention-days: 14

  quest-apk:
    name: Quest Android debug APK
    needs: [bed-asset]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download generated bed model
        uses: actions/download-artifact@v4
        with:
          name: bed-model-source
          path: art/bed/generated

      - name: Package bed GLB into Quest Android assets
        run: |
          mkdir -p quest-client/app/src/main/assets/models
          cp art/bed/generated/arc_upholstered_bed.glb quest-client/app/src/main/assets/models/arc_upholstered_bed.glb
          test -s quest-client/app/src/main/assets/models/arc_upholstered_bed.glb

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK / NDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Quest debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          gradle -p quest-client :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Quest APK
        run: |
          test -s quest-client/app/build/outputs/apk/debug/app-debug.apk
          unzip -t quest-client/app/build/outputs/apk/debug/app-debug.apk
          unzip -l quest-client/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/libqbxquest.so|AndroidManifest.xml'

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-apk
          path: quest-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  blender-bed:
    name: Build editable Blender bed project and studio render
    needs: [bed-asset]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download generated bed source models
        uses: actions/download-artifact@v4
        with:
          name: bed-model-source
          path: art/bed/generated

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libice6 libxrandr2 libxinerama1 libgl1 libegl1

      - name: Download Blender 4.5.15 LTS
        run: |
          wget -q https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -O /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C "$PWD"
          echo "$PWD/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
          "$PWD/blender-4.5.15-linux-x64/blender" --version

      - name: Build editable Blender project and render
        run: |
          ./blender-4.5.15-linux-x64/blender --background --python-exit-code 1 --python tools/blender_import_bed.py -- \
            --source art/bed/generated/arc_upholstered_bed_editable.glb \
            --output art/bed/arc_upholstered_bed.blend \
            --render art/bed/arc_upholstered_bed_blender_render.png
          test -s art/bed/arc_upholstered_bed.blend
          test -s art/bed/arc_upholstered_bed_blender_render.png

      - name: Assemble Blender release files
        run: |
          mkdir -p bed-release/textures
          cp art/bed/arc_upholstered_bed.blend bed-release/
          cp art/bed/arc_upholstered_bed_blender_render*.png bed-release/
          cp art/bed/generated/arc_upholstered_bed.glb bed-release/
          cp art/bed/generated/arc_upholstered_bed_editable.glb bed-release/
          cp art/bed/generated/bed_manifest.json bed-release/
          cp art/bed/generated/textures/*.png bed-release/textures/

      - name: Upload Blender project and model files
        uses: actions/upload-artifact@v4
        with:
          name: bed-blender-deliverables
          path: bed-release/
          if-no-files-found: error
          retention-days: 30

  combined-package:
    name: Combined portable ZIP + Windows installer
    needs: [windows-portable, quest-apk]
    runs-on: windows-2022
    steps:
      - name: Check out source for installer definition
        uses: actions/checkout@v4

      - name: Download Windows files
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: bundle

      - name: Download Quest APK
        uses: actions/download-artifact@v4
        with:
          name: quest-apk
          path: bundle/QuestClient

      - name: Create release-ready package and checksum
        shell: pwsh
        run: |
          $apk = Join-Path $PWD 'bundle\QuestClient\app-debug.apk'
          if (-not (Test-Path $apk)) { throw "Expected APK not found: $apk" }
          Rename-Item $apk 'QuestBridgeXR-Quest-debug.apk'
          $version = '0.8.1'
          if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $version = $Matches[1] }
          @"
          QuestBridge XR $version portable package
          Build commit: $env:GITHUB_SHA

          Windows: launch QuestBridgeStudio.exe.
          Quest Android debug APK: QuestClient\QuestBridgeXR-Quest-debug.apk

          IMPORTANT: This package includes the experimental D3D11 QuestBridge OpenXR runtime and
          mirror compositor. It is not Khronos-conformance-tested, supports a limited API surface,
          and may not run arbitrary OpenXR apps. Test only via Studio's per-process runtime override;
          do not register it as the system-wide active runtime. The Quest video path uses a capture
          and encode process and is not direct GPU reprojection/timewarp. Meta Quest Link remains a
          fallback for compatible applications. CI success is not proof of physical Quest validation.
          "@ | Set-Content -Encoding UTF8 (Join-Path $PWD 'bundle\BUILD-INFO.txt')
          $zipName = "QuestBridgeXR-$version-Portable.zip"
          Compress-Archive -Path 'bundle\*' -DestinationPath $zipName -CompressionLevel Optimal -Force
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding ASCII "$zipName.sha256"

          choco install innosetup --no-progress --yes
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found after installation.' }
          New-Item -ItemType Directory -Path 'installer-output' -Force | Out-Null
          & $iscc 'installer/QuestBridgeXR.iss' "/DMyAppVersion=$version" "/DSourceDir=$PWD\bundle" "/O$PWD\installer-output"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installer compilation failed.' }
          $setup = Join-Path $PWD "installer-output\QuestBridgeXR-$version-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Expected setup executable was not created: $setup" }
          Copy-Item $setup (Join-Path $PWD "QuestBridgeXR-$version-Setup.exe") -Force
          Write-Host "Created $zipName ($hash) and QuestBridgeXR-$version-Setup.exe"

      - name: Upload combined portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: QuestBridgeXR-Portable
          path: |
            QuestBridgeXR-*-Portable.zip
            QuestBridgeXR-*-Portable.zip.sha256
            QuestBridgeXR-*-Setup.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish downloadable GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [combined-package, blender-bed]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release-ready package
        uses: actions/download-artifact@v4
        with:
          name: QuestBridgeXR-Portable
          path: release-assets

      - name: Download editable Blender bed project
        uses: actions/download-artifact@v4
        with:
          name: bed-blender-deliverables
          path: release-assets/bed

      - name: Publish assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'QuestBridge XR Nightly' || format('QuestBridge XR {0}', github.ref_name) }}
          tag_name: ${{ github.ref == 'refs/heads/main' && 'nightly' || github.ref_name }}
          target_commitish: main
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          make_latest: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.sha256
            release-assets/*.exe
            release-assets/bed/*.blend
            release-assets/bed/*.png
            release-assets/bed/*.glb
            release-assets/bed/*.json
            release-assets/bed/textures/*.png
