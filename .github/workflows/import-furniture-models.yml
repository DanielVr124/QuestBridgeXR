name: Import uploaded furniture models and build

on:
  push:
    branches: [main]
    paths:
      - 'QuestBridgeXR-Furniture-Models.zip'

permissions:
  contents: write
  actions: write

jobs:
  import-models:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and install the three supplied GLB models
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import pathlib
          import struct
          import zipfile

          archive = pathlib.Path("QuestBridgeXR-Furniture-Models.zip")
          if not archive.is_file():
              raise SystemExit("Upload QuestBridgeXR-Furniture-Models.zip to the repository root.")

          expected = {
              "quest-client/app/src/main/assets/models/user_tv.glb.gz": "user_tv.glb.gz",
              "quest-client/app/src/main/assets/models/user_gaming_chair.glb.gz": "user_gaming_chair.glb.gz",
              "quest-client/app/src/main/assets/models/user_mouse.glb.gz": "user_mouse.glb.gz",
          }

          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              names = set(zf.namelist())
              missing = sorted(set(expected) - names)
              if missing:
                  raise SystemExit("Furniture package is missing: " + ", ".join(missing))

              target = pathlib.Path("quest-client/app/src/main/assets/models")
              target.mkdir(parents=True, exist_ok=True)
              for member, filename in expected.items():
                  compressed = zf.read(member)
                  if not compressed.startswith(b"\\x1f\\x8b"):
                      raise SystemExit(f"{filename} is not a gzip-compressed GLB.")
                  raw = gzip.decompress(compressed)
                  if len(raw) < 12 or raw[:4] != b"glTF":
                      raise SystemExit(f"{filename} does not contain a valid GLB header.")
                  if struct.unpack_from("<I", raw, 8)[0] != len(raw):
                      raise SystemExit(f"{filename} has an invalid GLB length header.")
                  if len(raw) > 32 * 1024 * 1024:
                      raise SystemExit(f"{filename} exceeds the 32 MiB decoded-model limit.")
                  (target / filename).write_bytes(compressed)
                  print(f"Installed {filename}: {len(compressed):,} compressed bytes, {len(raw):,} decoded bytes")

          archive.unlink()
          PY

      - name: Commit the imported furniture models
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No furniture model changes to commit."
            exit 0
          fi
          git commit -m "Import supplied TV, gaming chair, and mouse models"
          git push origin HEAD:main

      - name: Start the Windows and Quest builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-release.yml --repo "${GITHUB_REPOSITORY}" --ref main
