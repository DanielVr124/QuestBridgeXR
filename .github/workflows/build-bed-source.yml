name: Build Blender Bed Model

on:
  workflow_run:
    workflows: ["QuestBridge XR Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: questbridge-blender-bed-source
  cancel-in-progress: true

jobs:
  build-bed-source:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Blender 4.5.15 bed project + Cycles renders
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the successful main build source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Build Blender source for this successful main build
        id: changes
        shell: bash
        run: |
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Building the current Blender bed source and five review renders."
      - name: Set up Python
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bed generator dependencies
        if: steps.changes.outputs.changed == 'true'
        run: python -m pip install --disable-pip-version-check numpy pillow scipy trimesh

      - name: Generate runtime and editable bed meshes
        if: steps.changes.outputs.changed == 'true'
        env:
          QBX_BED_OUTPUT_DIR: ${{ github.workspace }}/art/bed
          QBX_BED_RUNTIME_GLB: ${{ github.workspace }}/quest-client/app/src/main/assets/models/arc_upholstered_bed.glb
        run: |
          python tools/generate_bed_asset.py
          test -s art/bed/arc_upholstered_bed_editable.glb
          test -s quest-client/app/src/main/assets/models/arc_upholstered_bed.glb
          python - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path("art/bed/bed_manifest.json").read_text())
          assert manifest["runtime_draw_meshes"] == 8
          assert manifest["editable_mesh_objects"] >= 40
          print("Bed asset:", manifest["dimensions"], "metres;",
                manifest["triangles"], "triangles")
          PY

      - name: Restore Blender 4.5.15 cache
        if: steps.changes.outputs.changed == 'true'
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/blender-4.5.15
          key: blender-4.5.15-linux-x64

      - name: Install Blender 4.5.15
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          BLENDER_DIR="$HOME/.cache/blender-4.5.15"
          if [[ ! -x "$BLENDER_DIR/blender" ]]; then
            mkdir -p "$BLENDER_DIR"
            curl --fail --location --retry 3 --retry-delay 3 \
              https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz \
              --output /tmp/blender-4.5.15-linux-x64.tar.xz
            tar -xJf /tmp/blender-4.5.15-linux-x64.tar.xz \
              --strip-components=1 -C "$BLENDER_DIR"
          fi
          "$BLENDER_DIR/blender" --version | head -3

      - name: Build editable Blender project and render five views
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          "$HOME/.cache/blender-4.5.15/blender" --background \
            --python tools/blender_import_bed.py -- \
            --source art/bed/arc_upholstered_bed_editable.glb \
            --output art/bed/arc_upholstered_bed.blend \
            --render-dir art/bed/renders
          test -s art/bed/arc_upholstered_bed.blend
          test -s art/bed/renders/bed_three_quarter.png
          test -s art/bed/renders/bed_headboard.png
          test -s art/bed/renders/bed_headboard_detail.png
          test -s art/bed/renders/bed_side_profile.png
          test -s art/bed/renders/bed_foot_three_quarter.png

      - name: Render whole-room tour and LED colour variants
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          "$HOME/.cache/blender-4.5.15/blender" --background \
            --python tools/render_room_showcase.py -- \
            --bed art/bed/arc_upholstered_bed_editable.glb \
            --desk quest-client/app/src/main/assets/models/arc_gaming_desk.glb \
            --monitor quest-client/app/src/main/assets/models/arc27_curved_monitor.glb \
            --output-dir art/room-showcase
          test -s art/room-showcase/room_showcase_scene.blend
          test -s art/room-showcase/renders/01_room_entry_wide.png
          test -s art/room-showcase/renders/07_headboard_reclined_view.png
          test -s art/room-showcase/renders/20_desk_triple_monitor_option.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("art/room-showcase")
          renders = sorted((root / "renders").glob("*.png"))
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          font = ImageFont.truetype(font_path, 16) if Path(font_path).exists() else ImageFont.load_default()
          def sheet(name, files, cols=4, cell=(360, 245)):
              rows = (len(files) + cols - 1) // cols
              canvas = Image.new("RGB", (cols * cell[0], rows * cell[1]), (12, 16, 28))
              draw = ImageDraw.Draw(canvas)
              for i, path in enumerate(files):
                  image = Image.open(path).convert("RGB")
                  image.thumbnail((cell[0] - 12, cell[1] - 42), Image.Resampling.LANCZOS)
                  x = (i % cols) * cell[0] + (cell[0] - image.width) // 2
                  y = (i // cols) * cell[1] + 4
                  canvas.paste(image, (x, y))
                  label = path.stem.replace("_", " ")
                  draw.text(((i % cols) * cell[0] + 8, (i // cols) * cell[1] + cell[1] - 31),
                            label[:44], fill=(232, 239, 255), font=font)
              canvas.save(root / name, quality=92)
          detail = [p for p in renders if "__" not in p.name and p.stem not in ("20_desk_triple_monitor_option",)]
          variants = [p for p in renders if "__" in p.name]
          sheet("gallery_room_tour.png", detail)
          sheet("gallery_led_variants.png", variants, cols=3, cell=(440, 280))
          sheet("gallery_complete.png", renders, cols=4)
          out = Path("dist/QuestBridgeXR-Room-Showcase-Renders.zip")
          out.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(out, "w", ZIP_DEFLATED, compresslevel=6) as z:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      z.write(path, path.relative_to(root.parent).as_posix())
          print("Room showcase images:", len(renders), "zip:", out.stat().st_size)
          PY

      - name: Upload whole-room render set
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: QuestBridgeXR-Room-Showcase-Renders
          path: |
            art/room-showcase
            dist/QuestBridgeXR-Room-Showcase-Renders.zip
          if-no-files-found: error
          retention-days: 30

      - name: Package Blender project, source and renders
        if: steps.changes.outputs.changed == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          root = Path.cwd()
          files = [
              Path('art/bed/arc_upholstered_bed.blend'),
              Path('art/bed/arc_upholstered_bed_editable.glb'),
              Path('quest-client/app/src/main/assets/models/arc_upholstered_bed.glb'),
              Path('art/bed/bed_manifest.json'),
              Path('art/bed/README.md'),
              Path('art/bed/renders/bed_three_quarter.png'),
              Path('art/bed/renders/bed_headboard.png'),
              Path('art/bed/renders/bed_headboard_detail.png'),
              Path('art/bed/renders/bed_side_profile.png'),
              Path('art/bed/renders/bed_foot_three_quarter.png'),
              Path('tools/generate_bed_asset.py'),
              Path('tools/generate_bed_asset.py.gz'),
              Path('tools/bed_design_patch.py'),
              Path('tools/blender_bed_camera_patch.py'),
              Path('tools/blender_import_bed.py'),
              Path('tools/blender_import_bed.py.gz'),
          ] + sorted(Path('art/bed/textures').glob('*.png'))
          out = Path('dist/QuestBridgeXR-Bed-Model-Blender-Source.zip')
          out.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(out, 'w', ZIP_DEFLATED, compresslevel=7) as z:
              for path in files:
                  if not path.is_file():
                      raise FileNotFoundError(path)
                  z.write(path, path.as_posix())
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          out.with_suffix(out.suffix + '.sha256').write_text(f'{digest}  {out.name}\n')
          print('Created', out, 'bytes=', out.stat().st_size)
          PY

      - name: Upload Blender bed project artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: QuestBridgeXR-Blender-Bed-Source
          path: |
            dist/QuestBridgeXR-Bed-Model-Blender-Source.zip
            dist/QuestBridgeXR-Bed-Model-Blender-Source.zip.sha256
            dist/QuestBridgeXR-Room-Showcase-Renders.zip
          if-no-files-found: error
          retention-days: 30

      - name: Add Blender bed project to the Nightly Release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: QuestBridge XR Nightly
          tag_name: nightly
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/QuestBridgeXR-Bed-Model-Blender-Source.zip
            dist/QuestBridgeXR-Bed-Model-Blender-Source.zip.sha256
